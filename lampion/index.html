if(ST.find(s=>s[0]===id))seen.add(id);
const el=document.createElement("div");el.className="ov";el.id="ov";
el.innerHTML=`<div class="pop"><button class="x" id="cl" aria-label="Tutup">✕</button><h2>${t[1]} ${t[2]}</h2>${body(id)}</div>`;g.appendChild(el);
el.onclick=e=>{if(e.target===el)close()};$("#cl").onclick=close;wire(id);tabs()}
function close(){const o=$("#ov");if(o)o.remove();pop=null;tabs();if(seen.size===5&&!g.dataset.done){g.dataset.done=1;say("Semua ruang sudah dikunjungi. Terima kasih sudah berkeliling, sampai jumpa di hari bahagia!",7000)}}
function body(id){
if(id==="mem"){const P=(ic,p={})=>`<div class="box"><div class="av">${ic}</div><h3>${esc(p.name||"")}</h3><small>${esc(p.parents||"")}</small></div>`;return `<div class="two">${P("👰",D.bride)}${P("🤵",D.groom)}</div><p style="margin:0">${D.message?esc(D.message):`Dengan rahmat Allah, kami mengundang ${esc(guest)||"Bapak/Ibu/Saudara/i"} untuk hadir dan mendoakan.`}</p>`}
if(id==="acr")return (D.events||[]).map(e=>`<div class="box"><h3>${esc(e.title)}</h3>${esc(e.date)}${e.time?", "+esc(e.time):""}<br>${esc(e.place)}<br><a class="btn" style="margin-top:8px" target="_blank" rel="noopener" href="${su(e.map)||"https://www.google.com/maps/search/"+encodeURIComponent(e.place||"")}">Buka peta</a></div>`).join("")||"<p>Jadwal acara segera diumumkan.</p>";
if(id==="gal"){const G=D.gallery||[];return G.length?`<div class="gal">${G.map(u=>`<div style="background:#0001"><img src="${su(u)}" alt="Foto mempelai" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:10px"></div>`).join("")}</div>`:"<p>Foto belum ditambahkan.</p>"}
if(id==="rsv")return `<div class="seg"><button data-a="Hadir" aria-pressed="${att==="Hadir"}">Hadir</button><button data-a="Berhalangan" aria-pressed="${att==="Berhalangan"}">Berhalangan</button></div><input class="fld" id="rn" placeholder="Namamu" value="${esc(guest)}"><input class="fld" id="rj" type="number" min="1" max="5" value="1" aria-label="Jumlah tamu"><textarea class="fld" id="wt" rows="3" placeholder="Tulis ucapan dan doa"></textarea><button class="btn" id="rs">Kirim</button><p id="rm" style="margin:8px 0 0"></p><div id="wl"></div>`;
if(id==="amp"){const B=D.bank||{};return (B.number?`<div class="box"><h3>${esc(B.name||"")} ${esc(B.number)}</h3>a.n. ${esc(B.holder||"")}<br><button class="btn" id="cp" style="margin-top:8px">Salin nomor</button></div>`:"")+(D.qris?`<div class="box" style="text-align:center"><img src="${su(D.qris)}" alt="QRIS" style="max-width:100%;border-radius:8px"></div>`:"")||"<p>Informasi amplop digital belum tersedia.</p>"}
return `<p style="margin:0 0 8px">Mochi ingin tahu namamu.</p><input class="fld" id="sn" placeholder="Namamu" value="${esc(guest)}"><button class="btn" id="ss">Simpan nama</button>`}
function wire(id){
if(id==="rsv"){document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{att=b.dataset.a;document.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
const L=()=>$("#wl").innerHTML=WS.map(w=>`<div class="wish"><b>${esc(w.n)}</b><br>${esc(w.t)}</div>`).join("");L();
$("#rs").onclick=async()=>{const n=$("#rn").value.trim().slice(0,60)||"Tamu",t=$("#wt").value.trim().slice(0,500),j=cl(+$("#rj").value||1,1,5),btn=$("#rs"),m=$("#rm");btn.disabled=true;
if(INV){const r=await sendWish(INV.id,{guest_name:n,message:t,attending:att==="Hadir"?"hadir":"tidak",guests:j});if(r.error){m.textContent="Gagal mengirim. Coba lagi sebentar.";btn.disabled=false;return}}
if(t)WS.unshift({n:n+" ("+att+")",t});$("#wt").value="";L();btn.disabled=false;m.textContent="Terima kasih, "+n+". Konfirmasi "+att.toLowerCase()+" tercatat."}}
if(id==="amp"&&$("#cp"))$("#cp").onclick=async()=>{const v=String((D.bank||{}).number||"");try{await navigator.clipboard.writeText(v);$("#cp").textContent="Tersalin"}catch(e){$("#cp").textContent=v}};
if(id==="sapa")$("#ss").onclick=()=>{guest=$("#sn").value.trim();$("#lb").textContent=guest||"Tamu";close();say("Halo, "+esc(guest||"Tamu")+"! Selamat datang di Lorong Lampion.",4000)}}
function tm(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();mus=!mus;clearTimeout(mto);if(mus){ac.resume();pl()}$("#ms").textContent=mus?"MAIN":"JEDA"}catch(e){}}
function pl(){if(!mus)return;const f=[293.66,329.63,392,440,493.88,587.33,659.25][Math.random()*7|0],o=ac.createOscillator(),q=ac.createGain(),n=ac.currentTime;o.type="triangle";o.frequency.value=f;q.gain.setValueAtTime(.0001,n);q.gain.exponentialRampToValueAtTime(.12,n+.01);q.gain.exponentialRampToValueAtTime(.0001,n+1.4);o.connect(q);q.connect(ac.destination);o.start();o.stop(n+1.5);mto=setTimeout(pl,300+Math.random()*500)}
$("#mt").onclick=tm;$("#sp").onclick=()=>{if(started&&!pop)open("sapa")};
$("#go").onclick=()=>{guest=$("#gn").value.trim();$("#lb").textContent=guest||"Tamu";$("#intro").remove();started=true;if(!mus)tm();say("Meong! Lorong ini menuju halaman dalam. Acara, galeri, dan amplop menunggu di sana.",6000)};
const jo=$("#jo"),kn=$("#kn");let jid=null;
function jm(e){const r=jo.getBoundingClientRect(),Rr=r.width/2;let x=(e.clientX-r.left-Rr)/Rr,y=(e.clientY-r.top-Rr)/Rr;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}jx=x;jyv=y;kn.style.transform=`translate(${x*Rr*.55}px,${y*Rr*.55}px)`}
jo.onpointerdown=e=>{jid=e.pointerId;jo.setPointerCapture(jid);jm(e)};jo.onpointermove=e=>{if(e.pointerId===jid)jm(e)};
jo.onpointerup=jo.onpointercancel=()=>{jid=null;jx=jyv=0;kn.style.transform=""};
const act=()=>{if(started&&!pop&&near)open(near)};
$("#ab").onpointerdown=e=>{e.preventDefault();act()};
addEventListener("keydown",e=>{if(e.key==="Escape"&&pop)close();else if((e.key==="Enter"||e.key===" ")&&started&&!pop){e.preventDefault();act()}else if(started&&!pop){K[e.key]=1;if(e.key.startsWith("Arrow"))e.preventDefault()}});
addEventListener("keyup",e=>K[e.key]=0);
const rs=()=>g.style.setProperty("--u",g.clientWidth/100+"px");addEventListener("resize",rs);rs();
async function init(){
const st=$("#stt"),go=$("#go");
if(guestParam)$("#gn").value=guestParam.slice(0,60);
if(slug){go.disabled=true;st.textContent="Memuat undangan...";
try{INV=await loadInvite();D=INV.data||{}}catch(e){st.textContent="Undangan tidak ditemukan. Periksa kembali link-nya.";return}
try{WS=(await getWishes()).map(w=>({n:w.guest_name+(w.attending==="hadir"?" (Hadir)":w.attending==="tidak"?" (Berhalangan)":""),t:w.message}))}catch(e){WS=[]}
st.textContent="";go.disabled=false}
else st.textContent="Mode contoh. Tambahkan ?u=kode-undangan pada link.";
const cp=((D.bride||{}).nick||"")+" & "+((D.groom||{}).nick||"");$("#cpl").textContent=cp;document.title="Undangan "+cp}
init();tabs();requestAnimationFrame(frame);
</script>
</body>
</html>
